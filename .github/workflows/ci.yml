name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Build
        run: cp .env.example .env.production.local && yarn build
